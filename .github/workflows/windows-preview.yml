name: Windows preview checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: npm run pack:check
      - run: npm run release:manifest
      - run: npm run bundle:windows
      - run: npm run bundle:smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: converoom-windows-x64
          path: |
            .artifacts/windows-bundle/build-*/converoom-*-windows-x64.zip
            .artifacts/windows-bundle/latest.json
            .artifacts/windows-bundle/smoke.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
