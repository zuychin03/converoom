name: Windows preview checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: verify (Node ${{ matrix.node }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 24.22.2
          - node: 26.13.0
            bundle: true
    env:
      CONVEROOM_EXPECT_NODE: ${{ matrix.node }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: npm run pack:check
      - run: npm run release:manifest
      - if: matrix.bundle
        run: npm run bundle:windows
      - if: matrix.bundle
        run: npm run bundle:smoke
      - if: matrix.bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: converoom-windows-x64
          path: |
            .artifacts/windows-bundle/build-*/converoom-*-windows-x64.zip
            .artifacts/windows-bundle/latest.json
            .artifacts/windows-bundle/smoke.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
